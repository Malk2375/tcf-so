{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a8a">
  <title>Hors ligne · Entraînement TCF SO</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'icons/favicon-32.png' %}" type="image/png">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-base text-slate-900">
  <header class="bg-blue-900 text-white shadow">
    <div class="mx-auto flex min-h-14 max-w-5xl items-center px-4 text-lg font-semibold">TCF SO</div>
  </header>
  <main class="mx-auto w-full max-w-xl flex-1 px-4 py-10">
    <div class="card">
      <h1 class="text-2xl font-bold">Vous êtes hors ligne</h1>
      <p class="mt-3 text-slate-800">Connexion requise pour passer un test.</p>
      <p class="mt-2 text-slate-700">Vérifiez votre connexion (Wi-Fi ou données mobiles), puis réessayez.</p>
      <button type="button" class="btn btn-primary mt-6 w-full sm:w-auto" onclick="window.location.reload()">Réessayer</button>
    </div>
  </main>
</body>
</html>
