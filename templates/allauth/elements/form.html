{% load allauth %}
<form method="{{ attrs.method }}" class="form-stack mt-6 space-y-5"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
  {% slot body %}{% endslot %}
  <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:items-center">
    {% slot actions %}{% endslot %}
  </div>
</form>
