# Production : deux services, « caddy » (HTTPS, fichiers statiques et audio) et « web » (Django).
# Lancé par deploy/deploy.sh depuis la racine du projet :
#   docker compose --env-file .env -f deploy/compose.yml up -d
name: tcf-so

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - data:/app/data
      - static:/app/staticfiles
    expose:
      - "8000"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Adresse IP du VPS (ou nom de domaine) et adresse e-mail pour Let's Encrypt, lues dans .env.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/srv/data:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  static:
  caddy_data:
  caddy_config:
